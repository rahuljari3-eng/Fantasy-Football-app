name: Sync league snapshot

# Keeps src/data/{leagueTeams,myTeam,freeAgents}.ts from drifting from ESPN --
# see scripts/syncLeagueSnapshot.ts. Runs on a schedule so waiver adds/drops,
# streamed defenses, and trades show up in the app without anyone having to
# remember to run the script by hand. A push to main here triggers the
# existing Vercel auto-deploy, so the live site picks it up too. The app
# itself also overlays live ESPN rosters on load (useFantasyApp), so a
# pickup or trade shows up there right away; this keeps the bundled
# fallback and projection history current.

on:
  schedule:
    # Hourly. GitHub may delay scheduled runs slightly under load;
    # that's fine for this use case.
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

# Hourly runs mustn't overlap and race each other's push.
concurrency:
  group: sync-snapshot
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run sync:snapshot

      # Custom vs ESPN projection history for the Build roster tab's accuracy
      # comparison, plus the weekly Vegas lines behind each player's Vegas
      # value, in-game injury exits, and each player's role in his offense
      # (snap/target/carry shares, red-zone looks) -- see
      # scripts/recordProjections.ts. Best-effort: a failed
      # recording shouldn't block the roster sync.
      - run: npm run record:projections
        continue-on-error: true

      # Real accepted redraft trades from FantasyCalc's public feed, the
      # yardstick the trade-value model is fit against (scripts/
      # recordMarketTrades.ts, scripts/fitTradeValue.ts). The feed only keeps
      # the last ~2 hours, so it's recorded every run. Best-effort.
      - run: npm run record:trades
        continue-on-error: true

      # Refit the boom/bust formula's tunables from every finished game
      # (scripts/fitBoomBust.ts) -- how the odds learn as the season goes.
      - run: npm run fit:boombust
        continue-on-error: true

      # Refit the custom weekly projection's blend from every finished week
      # (scripts/fitProjections.ts) -- adopted only once it beats the
      # hand-set blend in a walk-forward backtest.
      - run: npm run fit:projections
        continue-on-error: true

      - name: Commit and push if the roster data changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- src/data; then
            echo "No roster changes since last sync."
            exit 0
          fi
          git add src/data/leagueTeams.ts src/data/myTeam.ts src/data/freeAgents.ts src/data/projectionHistory.json src/data/vegasHistory.json src/data/vegasValues.ts src/data/boomBustModel.json src/data/projectionModel.json src/data/roleHistory.json src/data/marketTrades.json
          git commit -m "Sync league snapshot and projection history from ESPN [automated]"
          git push
